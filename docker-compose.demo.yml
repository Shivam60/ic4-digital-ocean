name: model-router-demo

services:
  mock-provider:
    build: .
    command: uvicorn mock_provider.openai:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/openapi.json")
      interval: 2s
      timeout: 2s
      retries: 15

  gateway:
    build: .
    env_file: deploy/demo.env
    environment:
      PROVIDERS: '{"dead":{"kind":"openai","base_url":"http://127.0.0.1:19999/v1"},"mock":{"kind":"openai","base_url":"http://mock-provider:8001/v1"}}'
    ports:
      - "8000:8000"
    depends_on:
      mock-provider:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/v1/health")
      interval: 2s
      timeout: 2s
      retries: 15
